[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sphereforge"
version = "0.1.0"
description = "Transform 360° camera footage into high-quality 3D Gaussian Splat scenes"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "SphereForge Contributors"},
]
keywords = ["3d", "gaussian-splatting", "panoramic", "360", "nerf", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.1",
    "pydantic>=2.5",
    "click>=8.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "plyfile>=1.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
depth = [
    "transformers>=4.36",
    "accelerate>=0.25",
]
sfm = []
occlusion = [
    "diffusers>=0.25",
    "lpips>=0.1.4",
]
yolo = [
    "ultralytics>=8.1",
]
rasterizer = [
    "gsplat>=1.0",
]
all = [
    "sphereforge[depth,sfm,occlusion,yolo,rasterizer]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "black>=24.1",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
sphereforge = "sphereforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length handled by black
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["sphereforge"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["sphereforge"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
]
